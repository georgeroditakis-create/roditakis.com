    <style>

        body, html {

            background-color: #0b0d0f;

        /* 100% Ενσωματωμένη η ultra-minimal εικόνα γραφείου σε Base64 */
        .bg-image {

            background-image: linear-gradient(rgba(11, 13, 15, 0.82), rgba(11, 13, 15, 0.82)),

            opacity: 0.85;
            margin-bottom: 25px;
        }

        .divider {
            width: 60px;
            height: 1px;
            background-color: #ffffff;
            margin: 0 auto 30px auto;
            opacity: 0.6;
        }

        .tagline {
            font-size: 1.1em;
            letter-spacing: 2px;
            line-height: 1.9;
            opacity: 0.8;
        }

        .footer {
            display: flex;

            font-size: 0.75em;
            letter-spacing: 2px;
            opacity: 0.65;

        @media (max-width: 768px) {
            h1 { font-size: 1.6em; letter-spacing: 4px; }
            .subtitle { font-size: 0.7em; letter-spacing: 3px; }
            .tagline { font-size: 0.9em; line-height: 1.6; }
            .footer { flex-direction: column; align-items: center; text-align: center; gap: 25px; }
