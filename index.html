<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιώργος Ροδιτάκης | Exclusive Accounting & Consulting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b1528;
            color: #ffffff;
            overflow: hidden;
        }
        /* Φόντο με την αρχιτεκτονική γεωμετρία (Dark Abstract Photo) */
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(11, 21, 40, 0.6), rgba(11, 21, 40, 0.85)), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920') no-repeat center center/cover;
            z-index: 1;
        }
        /* Top Header */
        .top-header {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 14px;
            letter-spacing: 1px;
            z-index: 10;
            opacity: 0.8;
        }
        /* Κεντρικό Περιεχόμενο */
        .main-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            z-index: 5;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 5px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .divider {
            width: 80px;
            height: 2px;
            background-color: #ffffff;
            margin-bottom: 40px;
        }
        .punchline {
            font-size: 15px;
            line-height: 1.8;
            max-width: 650px;
            letter-spacing: 1.5px;
            opacity: 0.85;
        }
        /* Footer */
        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            font-size: 12px;
            letter-spacing: 1px;
            line-height: 1.6;
            z-index: 10;
        }
        .footer-left a, .footer-right {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.7;
        }
        .footer-left a:hover {
            opacity: 1;
        }
        @media (max-width: 768px) {
            h1 { font-size: 22px; }
            h2 { font-size: 14px; letter-spacing: 3px; }
            .punchline { font-size: 13px; }
            .footer {
                flex-direction: column;
                gap: 20px;
                bottom: 20px;
                padding: 0 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    
    <div class="top-header">roditakis.com</div>

    <div class="main-container">
        <h1>Γιώργος Ροδιτάκης</h1>
        <h2>EXCLUSIVE ACCOUNTING & CONSULTING</h2>
        <div class="divider"></div>
        <p class="punchline">Όταν η ποιότητα προηγείται της ποσότητας, οι θέσεις είναι περιορισμένες. Κλείσε τη δική σου.</p>
    </div>

    <div class="footer">
        <div class="footer-left">
            roditakis.com<br>
            mob. 6957305335<br>
            <a href="mailto:giorgos@roditakis.com">giorgos@roditakis.com</a>
        </div>
        <div class="footer-right">
            &copy; 2026 by roditakis.com. all rights reserved
        </div>
    </div>

</body>
</html>
