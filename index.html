<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Γιώργος Ροδιτάκης | Exclusive Accounting & Consulting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: "Courier New", Courier, monospace;
            color: #ffffff;
            background-color: #0c1013;
            overflow: hidden;
        }

        /* Η σωστή ultra-minimal εικόνα γραφείου απευθείας στον κώδικα */
        .bg-image {
            background-image: linear-gradient(rgba(12, 16, 19, 0.78), rgba(12, 16, 19, 0.78)), 
                              url('https://images.unsplash.com/photo-1585776245991-cf89dd7fc73a?q=80&w=2000');
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            text-align: center;
        }

        /* Top Bar */
        .top-nav {
            text-align: left;
            font-size: 0.9em;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* Main Content */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.5em;
            font-weight: normal;
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9em;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: #ffffff;
            margin: 0 auto 30px auto;
            opacity: 0.7;
        }

        .tagline {
            font-size: 1.1em;
            letter-spacing: 2px;
            line-height: 1.8;
            opacity: 0.85;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.75em;
            letter-spacing: 1.5px;
            opacity: 0.7;
            text-align: left;
            line-height: 1.6;
        }

        .footer-right {
            text-align: right;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; letter-spacing: 4px; }
            .subtitle { font-size: 0.75em; letter-spacing: 3px; }
            .tagline { font-size: 0.95em; }
            .footer { flex-direction: column; align-items: center; text-align: center; gap: 20px; }
            .footer-right { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="bg-image">
        
        <div class="top-nav">
            roditakis.com
        </div>

        <div class="main-content">
            <h1>Γιώργος Ροδιτάκης</h1>
            <div class="subtitle">Exclusive Accounting & Consulting</div>
            <div class="divider"></div>
            <p class="tagline">Όταν η ποιότητα προηγείται της ποσότητας, οι θέσεις είναι περιορισμένες. Κλείστε τη δική σας.</p>
        </div>

        <div class="footer">
            <div class="footer-left">
                roditakis.com<br>
                mob. 6957305335<br>
                giorgos@roditakis.com
            </div>
            <div class="footer-right">
                © 2026 by roditakis.com. all rights reserved
            </div>
        </div>

    </div>

</body>
</html>
